name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/train_preprocessed.csv"
  TARGET_VAR: "target"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up python 3.13.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.13.7"

      - name: Check env
        run: |
          echo $CSV_URL

      - name: Install Depedencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          python modeling.py

      - name: Get latest MLflow run_id
        working-directory: MLProject
        run: |
          RUN_ID=$(python -c "
          import mlflow
          mlflow.set_tracking_uri('file:./mlruns')
          exp = mlflow.get_experiment_by_name('SMSML_Experiment')
          runs = mlflow.search_runs(experiment_ids=[exp.experiment_id], order_by=['start_time DESC'])
          print(runs.iloc[0].run_id)
          ")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Build Docker Model
        working-directory: MLProject
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "cc"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag cc ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
